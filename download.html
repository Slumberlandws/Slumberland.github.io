<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PttLB - Download</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="stage">
    <div class="canvas sub-page">

      <img class="bg" src="assets/img/PttLB_page__Image2.png" alt="" />
      <div class="tint tint-strong"></div>

      <header class="sub-head fade-in">
        <h1 data-i18n="dl_title">Download</h1>
        <p class="lead" data-i18n="dl_lead">Get PttLB on your favourite platform</p>
      </header>

      <!-- platform cards -->
      <div class="cards fade-in">
        <div class="card">
          <div class="card-ico">&#129302;</div>
          <h3 data-i18n="dl_windows">Windows</h3>
          <p data-i18n="dl_windows_d">PC client for Windows 10 / 11</p>
          <button class="card-btn" data-i18n="dl_get">Download</button>
        </div>

        <div class="card">
          <div class="card-ico">&#128241;</div>
          <h3 data-i18n="dl_android">Android</h3>
          <p data-i18n="dl_android_d">Mobile version for Android devices</p>
          <button class="card-btn" data-i18n="dl_get">Download</button>
        </div>

        <div class="card">
          <div class="card-ico">&#63743;</div>
          <h3 data-i18n="dl_ios">iOS</h3>
          <p data-i18n="dl_ios_d">Available on the App Store</p>
          <button class="card-btn" data-i18n="dl_get">Download</button>
        </div>
      </div>

      <div class="anchor dl-note fade-in" data-i18n="dl_note">All platforms support cloud-sync progress.</div>

      <button class="anchor back-btn fade-in" data-i18n="pttlb_back"
        onclick="go('pttlb.html')">&#8592; Back</button>

      <button class="gear" aria-label="Settings">
        <img src="assets/img/齿轮.png" alt="Settings" />
      </button>

      <div class="settings-panel">
        <div class="panel-inner">
          <span class="panel-label" data-i18n="lang_label">Language</span>
          <div class="seg">
            <button type="button" data-lang-btn="zh" class="active">中文</button>
            <button type="button" data-lang-btn="en">English</button>
          </div>
          <span class="panel-label" data-i18n="music_label">Music</span>
          <button type="button" class="switch" data-music-switch><span class="knob"></span></button>
          <span class="music-state" data-music-state>ON</span>
          <span class="panel-label vol-label" data-i18n="volume_label">Volume</span>
          <input type="range" class="vol-slider" data-volume-slider min="0" max="100" value="100" />
        </div>
      </div>

    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
